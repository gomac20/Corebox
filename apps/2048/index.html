<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game">
      <header class="game-header">
        <h1 class="title">2048</h1>
        <div class="scores" aria-live="polite" aria-atomic="false">
          <div class="score-box">
            <span class="score-label">SCORE</span>
            <span class="score-value" id="score">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">BEST</span>
            <span class="score-value" id="best">0</span>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <p class="hint">방향키 또는 스와이프로 같은 숫자를 합쳐 2048을 만드세요.</p>
        <button type="button" class="btn" id="new-game">새 게임</button>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="2048 게임 보드"></div>

        <div class="overlay" id="win-overlay" role="dialog" aria-label="승리" hidden>
          <p class="overlay-text">2048 달성!</p>
          <div class="overlay-actions">
            <button type="button" class="btn" id="continue">계속하기</button>
            <button type="button" class="btn btn-secondary" id="win-new-game">새 게임</button>
          </div>
        </div>

        <div class="overlay" id="over-overlay" role="dialog" aria-label="게임 오버" hidden>
          <p class="overlay-text">게임 오버</p>
          <div class="overlay-actions">
            <button type="button" class="btn" id="restart">다시 시작</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
