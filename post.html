<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>글 - 내 블로그</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
  <script>
    // 첫 렌더링 전에 테마를 적용해 깜빡임을 막는다.
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="post">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">내 블로그</a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="다크 모드 전환"></button>
    </div>
  </header>
  <main id="main" class="container">
    <div id="app" aria-live="polite"><p class="status">불러오는 중…</p></div>
  </main>
  <footer class="site-footer">
    <div class="container">© 내 블로그</div>
  </footer>
</body>
</html>
