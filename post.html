<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>글 - 내 블로그</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b7a75'/%3E%3Cpath d='M50 20l26 15v30L50 80 24 65V35z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='50' r='7' fill='white'/%3E%3C/svg%3E">
  <script>
    // 첫 렌더링 전에 테마를 적용해 깜빡임을 막는다.
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="post">
  <div id="progress" class="progress" aria-hidden="true"></div>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="내 블로그 홈">
        <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 3.5l10.8 6.25v12.5L16 28.5 5.2 22.25V9.75z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
        </svg>
        <span>내 블로그</span>
        <small>LAB&nbsp;NOTES</small>
      </a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="다크 모드로 전환">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 119.8 3.5a6.7 6.7 0 0010.7 10.7z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <div id="app" aria-live="polite"><p class="status">불러오는 중…</p></div>
    </div>

  <footer class="site-footer">

    </div>
  </footer>
</body>
</html>
